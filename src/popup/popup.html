<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoForm AI</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="container">
        <!-- Dynamic Announcement / Maintenance Banner (controlled by remote config) -->
        <div id="announcementBanner" class="announcement-banner" style="display: none;" role="alert"></div>

        <!-- Header -->
        <header class="header">
            <div class="brand">
                <img src="../../assets/icons/icon48.png" alt="AutoForm" class="brand-logo" width="22" height="22">
                <div class="brand-text">
                    <h1 class="title">AutoForm</h1>
                    <span class="version-tag" id="versionTag">2.0.4</span>
                </div>
            </div>

            <div class="header-status">
                <div id="quotaBadge" class="quota-badge" style="display: none;" title="Hourly AI solve quota remaining" aria-label="Quota Remaining">
                    <svg class="quota-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                    <span id="quotaCount">--</span>
                </div>
                <div id="connectionPill" class="connection-pill status-online" aria-live="polite" title="4 AI Engines: Groq • Gemini • OpenRouter • NVIDIA">
                    <span id="connectionText" class="connection-text">4 Engines</span>
                </div>
            </div>
        </header>

        <!-- Main Form Detection Card -->
        <section id="formStatusCard" class="card form-status-card" aria-label="Form Status">
            <div class="card-icon-bubble">
                <svg class="card-svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <line x1="16" y1="13" x2="8" y2="13"/>
                    <line x1="16" y1="17" x2="8" y2="17"/>
                    <line x1="10" y1="9" x2="8" y2="9"/>
                </svg>
            </div>
            <div class="card-content">
                <div id="formStatusTitle" class="card-title">Scanning tab...</div>
                <div id="formStatusDesc" class="card-desc">Navigate to any Google Form</div>
            </div>
            <span id="questionBadge" class="badge" style="display: none;">0 Qs</span>
        </section>

        <!-- Site Detection / Exclusion Bar -->
        <div id="siteExclusionRow" class="site-exclusion-row" style="display: none;">
            <div class="site-exclusion-info">
                <span id="siteStatusDot" class="site-status-dot site-dot-active"></span>
                <span id="siteExclusionHost" class="site-host-name">example.com</span>
            </div>
            <button id="siteExclusionBtn" class="site-exclusion-btn" type="button" title="Toggle AutoForm detection on this domain">
                Disable on this site
            </button>
        </div>

        <!-- Action Buttons Group -->
        <div class="action-buttons-group">
            <button id="solveBtn" class="btn btn-primary" disabled aria-label="Fill Current Form">
                <span id="solveBtnIcon" class="btn-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                    </svg>
                </span>
                <span id="solveBtnText" class="btn-text">Fill Current Form</span>
                <div id="solveSpinner" class="spinner" style="display: none;" aria-hidden="true"></div>
            </button>

            <button id="instantAutofillBtn" class="btn btn-secondary" disabled aria-label="Instant Profile Autofill" title="Fills verified personal & contact fields instantly without using AI quota">
                <span class="btn-icon" style="color: #7241ff;">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                </span>
                <span class="btn-text">Instant Profile Fill</span>
                <span class="badge" style="font-size: 10px; padding: 1px 6px; background: rgba(114, 65, 255, 0.08); color: #7241ff; border: 1px solid rgba(114, 65, 255, 0.2);">0ms</span>
            </button>
        </div>

        <!-- Live Solving Progress Card -->
        <div id="popupProgressCard" class="popup-progress-card" style="display: none;" aria-live="polite">
            <div class="popup-progress-header">
                <span id="popupProgressStatus" class="popup-progress-status">Solving questions...</span>
                <span id="popupProgressPercent" class="popup-progress-percent">0%</span>
            </div>
            <div class="popup-progress-track">
                <div id="popupProgressBar" class="popup-progress-bar"></div>
            </div>
        </div>

        <!-- Configuration Section -->
        <section class="section">
            <div class="section-header">
                <span class="section-title">Preferences</span>
            </div>

            <div class="toggle-group">
                <div class="toggle-info">
                    <label for="previewBeforeFill" class="label toggle-label">
                        <span>Preview Before Fill</span>
                        <span class="preview-badge">Recommended</span>
                    </label>
                    <span class="toggle-hint">Review answers &amp; highlight unsure questions before filling</span>
                </div>
                <label class="switch" for="previewBeforeFill">
                    <input type="checkbox" id="previewBeforeFill" checked>
                    <span class="slider"></span>
                </label>
            </div>

            <div class="input-group">
                <label for="fabVisibilitySelect" class="label">Floating AI Button</label>
                <div class="select-wrapper">
                    <select id="fabVisibilitySelect" class="select">
                        <option value="smart" selected>Smart (Verified Forms Only)</option>
                        <option value="dedicated_only">Google Forms & Job ATS Only</option>
                        <option value="hidden">Hidden (Shortcut & Popup Only)</option>
                    </select>
                    <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>

            <div class="input-group">
                <label for="pacingSelect" class="label">Pacing & Speed</label>
                <div class="select-wrapper">
                    <select id="pacingSelect" class="select">
                        <option value="turbo">Turbo (~150ms • Fastest)</option>
                        <option value="natural" selected>Natural (~800ms • Balanced)</option>
                        <option value="stealth">Stealth Human (~1.5s • Human-like)</option>
                    </select>
                    <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>

            <div class="input-group">
                <label for="toneSelect" class="label">Answer Style</label>
                <div class="select-wrapper">
                    <select id="toneSelect" class="select">
                        <option value="accurate" selected>Accurate & Direct (High Precision)</option>
                        <option value="concise">Concise & Brief (1–2 Sentences)</option>
                        <option value="detailed">Detailed & Explanatory</option>
                    </select>
                    <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="6 9 12 15 18 9"/>
                    </svg>
                </div>
            </div>

            <div class="input-group">
                <label for="customContext" class="label">
                    <span>Target Persona</span>
                    <span class="label-hint">Optional</span>
                </label>
                <input type="text" id="customContext" class="input" placeholder="e.g. Computer Science student...">
            </div>

            <div class="memory-link-row">
                <button id="openMemoryBtn" class="memory-link-btn" title="Open Memory & Profile manager">
                    <svg class="memory-link-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 2a4 4 0 0 1 4 4v1a3 3 0 0 1 3 3v1a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-1a3 3 0 0 1 3-3V6a4 4 0 0 1 4-4z"/>
                        <path d="M6 13v6a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-6"/>
                    </svg>
                    <span>Memory & Profile</span>
                    <span id="memoryCount" class="memory-count" style="display: none;">0</span>
                    <svg class="memory-link-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <polyline points="9 18 15 12 9 6"/>
                    </svg>
                </button>
            </div>

            <!-- Stored Resume Status Indicator -->
            <div id="resumeStatusRow" class="resume-status-row" style="display: none; margin-top: 8px; padding: 7px 11px; background: rgba(99,102,241,0.06); border: 1px solid rgba(99,102,241,0.2); border-radius: 8px; font-size: 11.5px; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center; gap: 6px; overflow: hidden;">
                    <span style="color: #6366f1;">📄</span>
                    <span id="popupResumeName" style="font-weight: 600; color: #1e1b4b; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; max-width: 175px;">Resume.pdf</span>
                </div>
                <span style="color: #10b981; font-weight: 700; font-size: 10px; text-transform: uppercase;">Ready</span>
            </div>
        </section>

        <!-- Status Notification Toast -->
        <div id="popupStatus" class="status-msg" style="display: none;" role="status"></div>

        <!-- Footer -->
        <footer class="footer">
            <span id="quotaFooterText">150 Qs/hr • Resets hourly</span>
            <span id="footerProviders">Connecting...</span>
        </footer>
    </div>

    <script src="popup.js"></script>
</body>
</html>
