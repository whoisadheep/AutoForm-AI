name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-extension:
    name: Validate Extension & Bundler
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: npm install

      - name: Validate Manifest & Extension Assets
        run: npm run validate

      - name: Build Extension Packages
        run: npm run package

      - name: Verify Package Outputs Exist
        run: |
          test -f dist/autoform-ai.zip || exit 1
          test -f dist/autoform-ai-edge.zip || exit 1
          test -f dist/autoform-ai-firefox.zip || exit 1
          echo "All extension packages built successfully."

  test-server:
    name: Server Resilience Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Server Dependencies
        working-directory: server
        run: npm install

      - name: Run Server Unit & Integration Tests
        working-directory: server
        env:
          NODE_ENV: test
        run: npm test

  docker-build:
    name: Verify Docker Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        run: |
          docker build -t autoform-server:ci ./server
