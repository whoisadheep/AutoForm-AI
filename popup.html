<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Form Solver</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            width: 380px;
            min-height: 540px;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #fafafa;
            color: #2c3e50;
        }
        
        .container { padding: 24px; }
        
        .header {
            text-align: center;
            margin-bottom: 32px;
            padding-top: 8px;
            border-bottom: 1px solid #e8e8e8;
            padding-bottom: 20px;
        }
        
        .header h1 {
            font-size: 20px;
            margin-bottom: 6px;
            color: #1a1a1a;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        
        .header p {
            font-size: 12px;
            color: #6b7280;
            font-weight: 400;
        }
        
        .card {
            background: white;
            border: 1px solid #e8e8e8;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 16px;
        }
        
        .card-header {
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #f3f4f6;
        }
        
        .card-header h3 { 
            font-size: 14px; 
            color: #374151; 
            font-weight: 600;
            letter-spacing: -0.2px;
        }
        
        .input-group { margin-bottom: 16px; }
        .input-group label {
            display: block; 
            font-size: 12px; 
            margin-bottom: 8px;
            font-weight: 500; 
            color: #4b5563;
        }
        
        .input-wrapper { position: relative; }
        .input-group input {
            width: 100%; 
            padding: 10px 36px 10px 12px;
            border: 1px solid #d1d5db; 
            border-radius: 6px;
            font-size: 13px; 
            font-family: 'SF Mono', Monaco, 'Cascadia Code', monospace;
            transition: all 0.2s ease;
            background: #fafafa;
        }
        .input-group input:focus {
            outline: none; 
            border-color: #6b7280;
            background: white;
        }
        
        .toggle-password {
            position: absolute; 
            right: 10px; 
            top: 50%;
            transform: translateY(-50%); 
            background: none; 
            border: none;
            cursor: pointer; 
            font-size: 16px; 
            color: #9ca3af;
            transition: color 0.2s;
        }
        
        .toggle-password:hover {
            color: #4b5563;
        }
        
        .btn-group {
            display: flex;
            gap: 8px;
        }

        .btn {
            width: 100%; 
            padding: 10px 16px; 
            border: 1px solid #d1d5db; 
            border-radius: 6px;
            font-size: 13px; 
            font-weight: 500; 
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 6px;
            background: white;
            color: #374151;
        }
        
        .btn:hover:not(:disabled) {
            border-color: #9ca3af;
            background: #f9fafb;
        }
        
        .btn:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
        }
        
        .btn-primary {
            background: #1a1a1a;
            color: white;
            border-color: #1a1a1a;
            flex: 2;
        }
        
        .btn-primary:hover:not(:disabled) {
            background: #2d2d2d;
            border-color: #2d2d2d;
        }
        
        .btn-secondary {
            flex: 1;
        }

        .btn-success {
            background: #1a1a1a;
            color: white;
            border-color: #1a1a1a;
            margin-bottom: 12px;
        }
        
        .btn-success:hover:not(:disabled) {
            background: #2d2d2d;
        }
        
        .status {
            font-size: 12px; 
            padding: 10px 12px; 
            border-radius: 6px;
            margin-top: 12px; 
            text-align: center; 
            display: none;
            border: 1px solid;
        }
        .status.success { 
            background: #f0fdf4; 
            color: #166534; 
            border-color: #bbf7d0;
        }
        .status.error { 
            background: #fef2f2; 
            color: #991b1b; 
            border-color: #fecaca;
        }
        .status.info { 
            background: #f8fafc; 
            color: #475569; 
            border-color: #e2e8f0;
        }
        
        .info-box {
            background: #f9fafb; 
            padding: 10px 12px; 
            border-radius: 6px;
            font-size: 11px; 
            color: #6b7280; 
            line-height: 1.5; 
            margin-top: 12px;
            border: 1px solid #f3f4f6;
        }
        
        .spinner {
            width: 12px; 
            height: 12px; 
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-top-color: white; 
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        .footer {
            text-align: center; 
            padding: 16px; 
            font-size: 11px;
            color: #9ca3af;
            border-top: 1px solid #e8e8e8;
            margin-top: 8px;
        }
        
        #keyStatus {
            margin-top: 8px; 
            font-size: 11px;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>AutoForm AI</h1>
            <p>Multi-Key Support</p>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>API Configuration</h3>
            </div>
            
            <div class="input-group">
                <label for="apiKey">Gemini API Key(s)</label>
                <div class="input-wrapper">
                    <input type="password" id="apiKey" placeholder="Enter one or more keys">
                    <button class="toggle-password" id="togglePassword">👁</button>
                </div>
                <div id="keyStatus"></div>
            </div>

            <div class="btn-group">
                <button class="btn btn-primary" id="saveKey">
                    <span id="saveKeyText">Save Keys</span>
                    <div class="spinner" id="saveSpinner" style="display: none;"></div>
                </button>
                <button class="btn btn-secondary" id="testKey">
                    Test
                </button>
            </div>
            
            <div class="info-box">
                Add multiple keys separated by commas to bypass rate limits
            </div>
        </div>
        
        <div class="card">
            <div class="card-header">
                <h3>Quick Actions</h3>
            </div>
            <button class="btn btn-success" id="solveBtn">
                <span id="solveBtnText">Fill Current Form</span>
                <div class="spinner" id="solveSpinner" style="display: none;"></div>
            </button>
            <div id="status" class="status"></div>
        </div>
    </div>
    
    <div class="footer">
        AutoForm AI v1.0
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
